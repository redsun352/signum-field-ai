name: Auto Repair Signum Field AI

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate Signum Field AI", "Build Signum Field AI APK"]
    types: [completed]

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  diagnose-and-repair:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout failing commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Collect failed run information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="${{ github.run_id }}"
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run view "$RUN_ID" --json status,conclusion,name,headSha,url > repair-run.json
          gh run view "$RUN_ID" --log > repair-run.log || true
          gh run view "$RUN_ID" --json jobs > repair-jobs.json || true

      - name: Install Node and dependencies
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Dependency and TypeScript diagnostics
        run: |
          set +e
          npm install 2>&1 | tee repair-npm.log
          npm run typecheck 2>&1 | tee repair-typecheck.log
          exit 0

      - name: Detect deterministic repair
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          REPAIR="none"
          REASON="No deterministic repair rule matched."
          if grep -Eq 'EAS CLI should not be installed|eas-cli.*installed in your project' repair-run.log repair-npm.log repair-typecheck.log 2>/dev/null; then
            REPAIR="remove-eas-cli"
            REASON="Expo Doctor reports eas-cli should not be installed as a project dependency."
          elif grep -Eq 'ERESOLVE.*expo|peer.*expo-|requires.*expo-' repair-npm.log 2>/dev/null; then
            REPAIR="expo-peer-conflict"
            REASON="npm reported an Expo peer dependency conflict; repair is intentionally gated to explicit safe mappings."
          elif grep -Eq 'TS[0-9]{3,5}|error TS[0-9]+' repair-typecheck.log 2>/dev/null; then
            REPAIR="typescript"
            REASON="TypeScript compiler errors detected; automatic source edits are disabled unless a deterministic rule matches."
          fi
          echo "repair=$REPAIR" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Apply safe repair - remove eas-cli dependency
        if: steps.detect.outputs.repair == 'remove-eas-cli'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'package.json';
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (d.devDependencies && d.devDependencies['eas-cli']) {
            delete d.devDependencies['eas-cli'];
          }
          fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n');
          NODE

      - name: Reinstall after repair
        if: steps.detect.outputs.repair == 'remove-eas-cli'
        run: npm install

      - name: Re-run validation after repair
        if: steps.detect.outputs.repair == 'remove-eas-cli'
        run: |
          npm run typecheck
          npx expo-doctor

      - name: Commit safe repair
        if: steps.detect.outputs.repair == 'remove-eas-cli'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json 2>/dev/null || git add package.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-repair: remove local eas-cli dependency"
          git push origin HEAD:${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Build failure report
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text='\n'.join([
              Path('repair-run.log').read_text(errors='ignore') if Path('repair-run.log').exists() else '',
              Path('repair-npm.log').read_text(errors='ignore') if Path('repair-npm.log').exists() else '',
              Path('repair-typecheck.log').read_text(errors='ignore') if Path('repair-typecheck.log').exists() else '',
          ])
          markers=['error','Error','ERROR','failed','FAIL','ERESOLVE','TS']
          lines=[x for x in text.splitlines() if any(m in x for m in markers)]
          report='\n'.join(lines[-300:])
          Path('AUTO_REPAIR_REPORT.md').write_text(
              '# Auto Repair Report\n\n'
              f'- Run: `{Path("repair-run.json").read_text(errors="ignore") if Path("repair-run.json").exists() else "unknown"}`\n'
              f'- Repair candidate: `{${{ steps.detect.outputs.repair }}}`\n'
              f'- Reason: `${{ steps.detect.outputs.reason }}`\n\n'
              '## Detected errors\n\n```text\n'+report+'\n```\n',
              encoding='utf-8')
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-repair-diagnostics
          path: |
            AUTO_REPAIR_REPORT.md
            repair-*.log
            repair-*.json

      - name: Create GitHub issue with diagnostics
        if: always() && github.event_name == 'workflow_run' && steps.detect.outputs.repair == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Auto Repair: manual intervention required for CI run $RUN_ID" --body-file AUTO_REPAIR_REPORT.md || true
