name: Build Signum Field AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: npx expo config --type public

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Verify EAS authentication
        run: npx eas-cli@23.2.0 whoami

      - name: Verify EAS project
        run: npx eas-cli@23.2.0 project:info

      - name: Build Android APK
        run: npx eas-cli@23.2.0 build --platform android --profile preview --non-interactive --wait
