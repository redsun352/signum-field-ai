name: Build Signum Field AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: npx expo config --type public

      - name: Check Expo authentication
        run: npx eas-cli@latest whoami

      - name: Ensure EAS project is linked
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '00000000-0000-0000-0000-000000000000' app.json 2>/dev/null; then
            echo 'Placeholder EAS projectId detected. Creating/linking project...'
            npx eas-cli@latest init --force --non-interactive
          else
            echo 'EAS projectId already present.'
          fi

      - name: Show resolved Expo config
        run: npx expo config --type public

      - name: Build Android APK
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
