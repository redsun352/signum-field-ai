name: Signum Field AI Healthcheck

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Expo config
        run: npx expo config --type public

      - name: Verify Expo authentication
        run: npx eas-cli@23.2.0 whoami

      - name: Verify EAS project
        run: npx eas-cli@23.2.0 project:info --non-interactive

      - name: TypeScript check
        run: npm run typecheck
